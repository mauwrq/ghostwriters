<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
    <title>Ghostwriters</title>
  </head>
  <body>
    <!--
      Filters that make straight lines look hand-drawn. Cycling between the
      three (see .sketchy in ui.css) makes the lines "boil" like animation
      drawn frame by frame.
    -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wobble-1">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" />
        <feDisplacementMap in="SourceGraphic" scale="3" />
      </filter>
      <filter id="wobble-2">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" />
        <feDisplacementMap in="SourceGraphic" scale="3" />
      </filter>
      <filter id="wobble-3">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" />
        <feDisplacementMap in="SourceGraphic" scale="3" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
